<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Executive - David Lorenzo Caracuel Matellán</title>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary-blue: #1d4ed8;
            --primary-dark: #0f172a;
            --accent-blue: #2563eb;
            --light-blue: #eff6ff;
            --border-color: #e2e8f0;
            --hover-bg: #f8fafc;
            --badge-bg: #f1f5f9;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 12px 28px rgba(15, 23, 42, 0.08);
            --btn-bg: #0f172a;
            --btn-text: #ffffff;
            --accent-teal: #0f766e;
            --accent-teal-bg: #f0fdfa;
            --accent-teal-border: #99f6e4;
        }

        body.dark-mode {
            --bg-body: #090d16;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-blue: #60a5fa;
            --primary-dark: #38bdf8;
            --accent-blue: #3b82f6;
            --light-blue: #1e3a8a;
            --border-color: #334155;
            --hover-bg: #273549;
            --badge-bg: #334155;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.4);
            --btn-bg: #38bdf8;
            --btn-text: #0f172a;
            --accent-teal: #2dd4bf;
            --accent-teal-bg: #134e4a;
            --accent-teal-border: #0f766e;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            font-size: 1rem;
            color: var(--text-main);
            background-color: var(--bg-body);
            margin: 0;
            padding: 40px 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .actions-bar {
            max-width: 960px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 50px 60px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s ease;
        }

        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 30px;
            margin-bottom: 35px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 30px;
        }

        .header-main { flex: 1; }

        h1.name-title {
            color: var(--primary-blue);
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            letter-spacing: -0.6px;
            line-height: 1.1;
        }

        .subhead-title {
            margin-bottom: 20px;
        }

        .subhead-role {
            display: block;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .subhead-specialties {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .highlights-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .highlight-item {
            flex: 1;
            min-width: 140px;
            background: var(--light-blue);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            text-align: center;
        }

        .highlight-number {
            display: block;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-blue);
            line-height: 1.2;
        }

        .highlight-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .contact-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .contact-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--hover-bg);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .contact-item a { color: var(--accent-blue); text-decoration: none; font-weight: 600; }
        .contact-item a:hover { text-decoration: underline; }

        .qr-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: var(--hover-bg);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .qr-img { width: 100px; height: 100px; border-radius: 6px; background: #ffffff; padding: 4px; }

        .qr-label {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-muted);
